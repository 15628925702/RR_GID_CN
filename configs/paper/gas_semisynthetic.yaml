schema_version: paper-e5-r1-v1
experiment_name: gas_semisynthetic
methods:
  - Uniform SQD
  - A-OSQD
  - Discriminative Score OED
  - RR-GID
budgets: [400, 800, 1600, 3200]
replications: 20
seed_manifest: experiments/paper/gas_semisynthetic_manifest.json
pilot_schedule:
  kind: anchored_power
  anchor_budget: 1600
  anchor_pilot: 160
  exponent: 0.5
  max_fraction: 0.2
scoring_steps: 4
scoring_max_step_norm: 2.0
score_backend: cached_qmc
score_qmc_order: 8
information_backend: cached_qmc_cross
information_qmc_order: 6
information_outer_rows: 128
information_scrambles: 2
dtype: float32
experiment_mode: bulk
gen_info_tilted: 64
gen_info_cond: 16
mlp_steps: 100
mlp_hidden: 64
generator_checkpoint: checkpoints/paper/vaeac_gas.pt
output_path: results/paper/gas_semisynthetic
