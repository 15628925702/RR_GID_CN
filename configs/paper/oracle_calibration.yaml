schema_version: paper-e4-v1
experiment_name: oracle_calibration
methods:
  - oracle RR-GID
budgets: [8000]
replications: 10
seed_manifest: experiments/paper/oracle_calibration_manifest.json
pilot_schedule:
  kind: anchored_power
  anchor_budget: 8000
  anchor_pilot: 400
  exponent: 0.5
  max_fraction: 0.2
scoring_steps: 4
scoring_max_step_norm: 2.0
score_backend: cached_qmc
score_qmc_order: 8
information_backend: cached_qmc_cross
information_qmc_order: 6
information_outer_rows: 128
information_scrambles: 2
dtype: float32
moment_dtype: float64
generator_checkpoint: null
output_path: results/paper/oracle_calibration
calibration:
  query_count: 200
  qmc_orders: [7, 8, 9]
  median_relative_error: 1.0e-3
  p95_relative_error: 1.0e-2
  max_abs_coordinate_error: 2.0e-2
  information_panels: 20
  information_betas: 5
  information_allocation: oracle
  information_op_tol: 0.05
  end_to_end_mean_abs_delta: 0.15
  adaptive_start_order: 8
  adaptive_max_order: 16
  adaptive_atol: 2.0e-5
  adaptive_rtol: 2.0e-4
  adaptive_scrambles: 4
  adaptive_chunk_rows: 64
